[package]
name = "prebake"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bakes Steam's Vulkan shader caches while you are away, so games start without \"Processing Vulkan shaders\""
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/guitaripod/prebake"
homepage = "https://midgarcorp.cc/linux/"
keywords = ["steam", "vulkan", "shaders", "fossilize", "proton"]
categories = ["command-line-utilities", "games"]

[dependencies]
anyhow = "1.0.104"
ash = "0.38.0"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
humantime = "2.4.0"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["socket", "fs", "signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
x11rb = { version = "0.14.0", features = ["screensaver"] }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
